<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Switchremote: Connecting talent with remote opportunities. Fresh remote jobs from around the world, updated automatically.">
<title>Switchremote | Remote jobs from around the world</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='20' y='4' width='24' height='56' rx='12'/%3E%3Ccircle cx='32' cy='17' r='8' fill='%23f3f3f3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&family=Noto+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111318;--muted:#68717c;--blue:#3cb8ff;--line:#e9edf1;--soft:#eff9ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:#fff;font:15px/1.55 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input{font:inherit}
.wrap{width:min(1080px,calc(100% - 32px));margin:auto}
.mark{display:block;position:relative;overflow:hidden;width:calc(var(--h)*1.78);height:var(--h)}.mark img{position:absolute;display:block;max-width:none;width:calc(var(--h)*2.5);left:calc(var(--h)*-.35);top:calc(var(--h)*-.75)}
header{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.links{display:flex;align-items:center;gap:22px;font-size:13px;font-weight:600;color:#555e68}
.cta{background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px}
.hero{padding:54px 0 24px}
h1{font:800 clamp(34px,5.5vw,56px)/1.06 Manrope,sans-serif;letter-spacing:-.055em;margin:0 0 14px;max-width:720px}
h1 span{color:#159fe9}
.lead{max-width:560px;color:var(--muted);font-size:17px;margin:0 0 6px}
.section{padding:24px 0}
h2{font:800 clamp(22px,3vw,28px)/1.15 Manrope,sans-serif;letter-spacing:-.04em;margin:0 0 6px}
.sub{font-size:14px;color:var(--muted);margin:0 0 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{flex:1;min-width:220px;min-height:46px;padding:0 14px;border:1px solid #dfe4e9;border-radius:12px;outline:none}
.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3cb8ff25}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 16px;border:1px solid #dfe4e9;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid #dfe4e9;background:#fff;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:#444c55;cursor:pointer}
