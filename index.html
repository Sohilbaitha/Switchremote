<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchremote - Remote jobs for freshers in Asia</title>
<meta name="description" content="Work-from-home, fresher-friendly jobs for Indonesia, Vietnam, Malaysia, the Philippines, Thailand and India. Updated every 6 hours.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Switchremote</h1>
    <p>Work-from-home jobs for freshers in Asia. Updated every 6 hours.</p>
  </header>

  <div class="filters">
    <input id="q" type="search" placeholder="Search job or company" aria-label="Search jobs">
    <select id="country" aria-label="Country">
      <option value="">All countries</option>
      <option>Indonesia</option>
      <option>Vietnam</option>
      <option>Malaysia</option>
      <option>Philippines</option>
      <option>Thailand</option>
      <option>India</option>
      <option>Worldwide</option>
    </select>
  </div>

  <p id="status" class="status">Loading jobs...</p>
  <main id="list"></main>

  <footer>
    <p id="updated"></p>
    <p>Jobs come from Remotive, Jobicy and company career pages. Apply always opens the original source.</p>
    <p><a href="legal.html#about">About</a> &nbsp; <a href="legal.html#disclaimer">Disclaimer</a> &nbsp; <a href="legal.html#privacy">Privacy</a> &nbsp; <a href="legal.html#contact">Contact</a></p>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
