name: Refresh jobs

# Runs every 6 hours, triggered by cron-job.org (GitHub's own schedule was often hours late).
# You can still run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_jobs.py
      # Writes feed.xml and posts new jobs to Telegram (only if the Telegram secrets are set)
      - run: python scripts/share_jobs.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "switchremote-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs.json feed.xml
          if [ -f data/shared.json ]; then git add data/shared.json; fi
          git diff --staged --quiet || (git commit -m "Update jobs" && git push)
