name: Refresh jobs

# Runs every 6 hours, triggered by cron-job.org (GitHub's own schedule was often hours late).
# You can still run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_jobs.py
        env:
          # Optional: a free Himalayas API key, only needed if we ever get rate limited
          HIMALAYAS_API_KEY: ${{ secrets.HIMALAYAS_API_KEY }}
      # Writes the country pages (remote-jobs-india.html and so on) and sitemap.xml
      - run: python scripts/build_pages.py
        continue-on-error: true
      - run: |
          git config user.name "switchremote-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs.json sitemap.xml remote-jobs-*.html
          git diff --staged --quiet || (git commit -m "Update jobs" && git push)
