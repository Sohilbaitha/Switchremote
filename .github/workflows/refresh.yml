name: Refresh jobs

# Runs every 6 hours, triggered by cron-job.org (GitHub's own schedule was often hours late).
# You can still run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_jobs.py
      - run: |
          git config user.name "switchremote-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs.json
          git diff --staged --quiet || (git commit -m "Update jobs" && git push)
