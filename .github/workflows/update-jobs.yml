
name: Update trusted remote jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-remote-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and filter trusted jobs
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlparse

          def fetch(url):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Switchremote/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          def clean(value):
              if isinstance(value, list):
                  return ", ".join(map(str, value))
              return html.unescape(str(value or ""))

          def plain(value):
              value = re.sub(r"<[^>]*>", " ", clean(value))
              return re.sub(r"\s+", " ", value).lower()

          COUNTRIES = {
              "India": ["india", "bangalore", "bengaluru", "mumbai",
                        "delhi", "hyderabad", "chennai", "pune", "noida"],
              "Indonesia": ["indonesia", "jakarta", "surabaya", "bandung",
                            "yogyakarta", "bali"],
              "Philippines": ["philippines", "manila", "cebu"],
              "Vietnam": ["vietnam", "viet nam", "ho chi minh", "hanoi"],
              "Malaysia": ["malaysia", "kuala lumpur", "penang"],
              "Thailand": ["thailand", "bangkok", "chiang mai"]
          }

          ALLOWED_COUNTRIES = set(COUNTRIES)

          def get_date(value):
              if not value:
                  return None
              try:
                  if isinstance(value, (int, float)):
                      if value > 10**12:
                          value /= 1000
                      return datetime.fromtimestamp(value, timezone.utc)
                  value = value.replace("Z", "+00:00")
                  result = datetime.fromisoformat(value)
                  if result.tzinfo is None:
                      result = result.replace(tzinfo=timezone.utc)
                  return result.astimezone(timezone.utc)
              except (ValueError, TypeError, OverflowError):
                  return None

          def eligible(job):
              title = job["title"].lower()
              location = job["location"].lower()
              description = plain(job["description"])
              text = title + " " + description
              mode_text = title + " " + location + " " + description

              # Require a clearly identified target country in location.
              country_found = any(
                  alias in location
                  for aliases in COUNTRIES.values()
                  for alias in aliases
              )
              if not country_found:
                  return False

              # Require explicit remote wording and reject onsite/hybrid.
              remote_terms = [
                  "remote", "fully remote", "100% remote",
                  "work from home", "work-from-home"
              ]
              if not any(term in mode_text for term in remote_terms):
                  return False

              reject_modes = [
                  "on-site", "onsite", "on site",
                  "hybrid", "in-office", "in office",
                  "office-based", "office based"
              ]
              if any(term in mode_text for term in reject_modes):
                  return False

              # Reject seniority and explicit experience requirements.
              reject_titles = [
                  "senior", "sr.", "principal", "staff engineer",
                  "director", "manager", "head of", "vice president",
                  "lead engineer", "team lead", "experienced"
              ]
              if any(term in title for term in reject_titles):
                  return False

              experience_patterns = [
                  r"\b[2-9]\+?\s+years?\s+(?:of\s+)?experience\b",
                  r"\b[2-9]\s*-\s*[0-9]+\s+years?\s+(?:of\s+)?experience\b",
                  r"\bminimum\s+(?:of\s+)?[2-9]\s+years?",
                  r"\bat least\s+[2-9]\s+years?"
              ]
              if any(re.search(p, text) for p in experience_patterns):
                  return False

              entry_terms = [
                  "intern", "internship", "entry-level", "entry level",
                  "graduate", "fresh graduate", "new grad", "trainee",
                  "junior", "no experience required",
                  "no prior experience", "0-1 years", "0–1 years",
                  "0 years of experience"
              ]
              if not any(term in title or term in description
                         for term in entry_terms):
                  return False

              # Require an identifiable target country and a recent date.
              posted = get_date(job.get("postedAt"))
              now = datetime.now(timezone.utc)
              if not posted or posted > now + timedelta(days=1):
                  return False
              if posted < now - timedelta(days=30):
                  return False

              return True

          with open("employers.json", encoding="utf-8") as f:
              config = json.load(f)

          jobs = []
          errors = []

          for employer in config.get("employers", []):
              if employer.get("approved") is not True:
                  continue

              name = clean(employer.get("company"))
              kind = clean(employer.get("source_type")).lower()
              token = clean(employer.get("board_token"))

              if not name or not token:
                  errors.append("Missing company or board token")
                  continue

              if kind not in ("greenhouse", "lever"):
                  errors.append(f"Unsupported source for {name}")
                  continue

              try:
                  if kind == "greenhouse":
                      data = fetch(
                          "https://boards-api.greenhouse.io/v1/boards/"
                          + token + "/jobs?content=true"
                      )
                      items = data.get("jobs", [])
                  else:
                      data = fetch(
                          "https://api.lever.co/v0/postings/"
                          + token + "?mode=json"
                      )
                      items = data if isinstance(data, list) else []

                  added = 0

                  for item in items:
                      if kind == "greenhouse":
                          title = clean(item.get("title"))
                          location = clean(
                              (item.get("location") or {}).get("name")
                          )
                          description = clean(item.get("content"))
                          url = clean(item.get("absolute_url"))
                          posted = clean(item.get("updated_at"))
                          job_id = clean(item.get("id"))
                          workplace = ""
                      else:
                          categories = item.get("categories") or {}
                          title = clean(item.get("text"))
                          location = clean(categories.get("location"))
                          description = clean(item.get("description"))
                          url = clean(item.get("hostedUrl"))
                          posted = clean(item.get("createdAt"))
                          job_id = clean(item.get("id"))
                          workplace = clean(item.get("workplaceType")).lower()

                      parsed = urlparse(url)
                      hosts = {
                          "greenhouse": ["boards.greenhouse.io"],
                          "lever": ["jobs.lever.co"]
                      }

                      if (
                          not title or not job_id
                          or parsed.scheme != "https"
                          or not parsed.hostname
                          or not any(
                              parsed.hostname == host
                              or parsed.hostname.endswith("." + host)
                              for host in hosts[kind]
                          )
                      ):
                          continue

                      # Lever explicitly identifies workplace type when available.
                      if workplace and workplace != "remote":
                          continue

                      job = {
                          "id": name + "-" + job_id,
                          "title": title,
                          "company": name,
                          "url": url,
                          "location": location,
                          "category": "",
                          "type": "Remote",
                          "salary": "",
                          "logo": "",
                          "source": kind.title(),
                          "description": description,
                          "postedAt": posted
                      }

                      if eligible(job):
                          jobs.append(job)
                          added += 1

                  print(f"{name}: checked {len(items)}; eligible {added}")

              except Exception as e:
                  errors.append(f"{name}: {e}")

          if errors:
              raise SystemExit(
                  "Feed error; existing jobs.json preserved: "
                  + "; ".join(errors)
              )

          unique = {}
          for job in jobs:
              key = job["url"].split("?")[0].rstrip("/").lower()
              unique.setdefault(key, job)

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "jobs": list(unique.values())
          }

          with open("jobs.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Saved {len(output['jobs'])} qualifying jobs")
          PY

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update trusted remote jobs"
            git push
          else
            echo "No changes to commit"
          fi
