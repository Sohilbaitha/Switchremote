
name: Update trusted remote jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-remote-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch approved employer jobs
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          def fetch(url):
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Switchremote/1.0"}
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode("utf-8"))

          def clean(value):
              if isinstance(value, list):
                  return ", ".join(map(str, value))
              return html.unescape(str(value or ""))

          def plain(value):
              return re.sub(r"<[^>]*>", " ", clean(value)).lower()

          def eligible(job, employer):
              title = job["title"].lower()
              location = job["location"].lower()
              description = plain(job["description"])
              text = title + " " + description

              asia_locations = [
                  "india", "indonesia", "philippines", "vietnam",
                  "malaysia", "singapore", "thailand", "pakistan",
                  "bangladesh", "sri lanka", "nepal", "cambodia",
                  "myanmar", "laos", "brunei", "japan", "south korea",
                  "taiwan", "hong kong", "china",
                  "jakarta", "surabaya", "bandung", "yogyakarta", "bali",
                  "manila", "cebu", "ho chi minh", "hanoi",
                  "kuala lumpur", "bangalore", "bengaluru", "mumbai",
                  "delhi", "hyderabad", "chennai", "pune", "dhaka",
                  "karachi", "lahore", "colombo", "kathmandu",
                  "bangkok", "singapore"
              ]

              worldwide_remote = any(x in location for x in [
                  "worldwide", "work from anywhere",
                  "anywhere in the world", "global remote"
              ])

              asia_eligible = any(x in location for x in asia_locations)

              if not asia_eligible and not worldwide_remote:
                  return False

              reject = [
                  "senior", "principal", "director", "manager",
                  "management", "head of ", "vice president",
                  "team lead", "lead engineer", "3+ years",
                  "4+ years", "5+ years", "3 years of experience",
                  "5 years of experience"
              ]
              if any(x in title or x in description for x in reject):
                  return False

              allow = [
                  "intern", "internship", "entry-level", "entry level",
                  "graduate", "fresh graduate", "new grad", "trainee",
                  "no experience required", "no prior experience",
                  "all levels of experience welcome"
              ]

              return any(x in text for x in allow)

          with open("employers.json", encoding="utf-8") as f:
              config = json.load(f)

          jobs = []
          errors = []

          for employer in config.get("employers", []):
              if employer.get("approved") is not True:
                  continue

              name = clean(employer.get("company"))
              kind = clean(employer.get("source_type")).lower()
              token = clean(employer.get("board_token"))

              if not name or not token:
                  errors.append("Missing company or board token")
                  continue

              try:
                  if kind == "greenhouse":
                      data = fetch(
                          "https://boards-api.greenhouse.io/v1/boards/"
                          + token + "/jobs?content=true"
                      )
                      items = data.get("jobs", [])

                  elif kind == "lever":
                      data = fetch(
                          "https://api.lever.co/v0/postings/"
                          + token + "?mode=json"
                      )
                      items = data if isinstance(data, list) else []

                  else:
                      errors.append(f"Unsupported source for {name}")
                      continue

                  added = 0

                  for item in items:
                      if kind == "greenhouse":
                          title = clean(item.get("title"))
                          location = clean(
                              (item.get("location") or {}).get("name")
                          )
                          description = clean(item.get("content"))
                          url = clean(item.get("absolute_url"))
                          posted = clean(item.get("updated_at"))
                          job_id = clean(item.get("id"))
                      else:
                          categories = item.get("categories") or {}
                          title = clean(item.get("text"))
                          location = clean(categories.get("location"))
                          description = clean(item.get("description"))
                          url = clean(item.get("hostedUrl"))
                          posted = clean(item.get("createdAt"))
                          job_id = clean(item.get("id"))

                      parsed = urlparse(url)
                      if not title or not job_id or parsed.scheme != "https":
                          continue

                      hosts = {
                          "greenhouse": ["boards.greenhouse.io"],
                          "lever": ["jobs.lever.co"]
                      }
                      if not any(
                          parsed.hostname == host
                          or parsed.hostname.endswith("." + host)
                          for host in hosts[kind]
                      ):
                          continue

                      job = {
                          "id": name + "-" + job_id,
                          "title": title,
                          "company": name,
                          "url": url,
                          "location": location or "Location not verified",
                          "category": "",
                          "type": "",
                          "salary": "",
                          "logo": "",
                          "source": kind.title(),
                          "description": description,
                          "postedAt": posted
                      }

                      if eligible(job, employer):
                          jobs.append(job)
                          added += 1

                  print(f"{name}: checked {len(items)}; eligible {added}")

              except Exception as e:
                  errors.append(f"{name}: {e}")

          if errors:
              raise SystemExit(
                  "Feed error; existing jobs.json preserved: "
                  + "; ".join(errors)
              )

          unique = {}
          for job in jobs:
              key = job["url"].split("?")[0].rstrip("/").lower()
              unique.setdefault(key, job)

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "jobs": list(unique.values())
          }

          with open("jobs.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Saved {len(output['jobs'])} eligible jobs")
          PY

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update trusted jobs"
            git push
          else
            echo "No changes to commit"
          fi
