
name: Update remote jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch remote jobs
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          sources = [
              ("Remotive", "https://remotive.com/api/remote-jobs"),
              ("Remote OK", "https://remoteok.com/api"),
              ("Arbeitnow", "https://www.arbeitnow.com/api/job-board-api"),
          ]

          jobs = []

          for source, url in sources:
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Switchremote/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(response.read().decode("utf-8"))

                  if source == "Remotive":
                      items = data.get("jobs", [])
                  elif source == "Remote OK":
                      items = data[1:] if isinstance(data, list) else []
                  else:
                      items = data.get("data", [])

                  for item in items:
                      title = item.get("title", "")
                      company = item.get("company_name") or item.get("company", "")
                      url_job = item.get("url") or item.get("apply_url") or ""

                      if not title or not company or not url_job:
                          continue

                      jobs.append({
                          "id": source + "-" + url_job,
                          "title": title,
                          "company": company,
                          "url": url_job,
                          "location": item.get("candidate_required_location")
                              or item.get("location")
                              or "Check employer listing",
                          "category": item.get("category")
                              or item.get("tags", []),
                          "type": item.get("job_type") or "",
                          "salary": item.get("salary") or "",
                          "logo": item.get("company_logo") or "",
                          "source": source,
                          "description": item.get("description", ""),
                          "postedAt": item.get("publication_date")
                              or item.get("date")
                              or item.get("created_at")
                              or ""
                      })

              except Exception as error:
                  print(f"{source} fetch failed: {error}")

          unique = {}
          for job in jobs:
              unique[job["url"]] = job

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "jobs": list(unique.values())[:300]
          }

          with open("jobs.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print(f"Saved {len(output['jobs'])} jobs")
          PY

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update remote jobs data"
            git push
          fi
