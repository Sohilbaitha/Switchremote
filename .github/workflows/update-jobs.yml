name: Update trusted remote jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-remote-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and filter jobs
        run: |
          python - <<'PY'
          import json, re, html, urllib.request
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlparse

          NOW = datetime.now(timezone.utc)

          ENTRY_TITLE = re.compile(
              r"\b(intern|internship|entry[- ]level|graduate|"
              r"fresh graduate|new grad|trainee|junior)\b")
          ENTRY_DESC = re.compile(
              r"\b(intern|internship|entry[- ]level|fresh graduate|"
              r"new grad|recent graduate|trainee|junior|"
              r"no experience required|no prior experience|"
              r"0[-–]1 years?|0 years of experience)\b")

          COUNTRIES = {
              "India": ["india", "bengaluru", "bangalore", "mumbai",
                        "delhi", "hyderabad", "chennai", "pune", "noida"],
              "Indonesia": ["indonesia", "jakarta", "surabaya", "bandung",
                            "yogyakarta", "bali"],
              "Philippines": ["philippines", "manila", "cebu"],
              "Vietnam": ["vietnam", "viet nam", "ho chi minh", "hanoi"],
              "Malaysia": ["malaysia", "kuala lumpur", "penang"],
              "Thailand": ["thailand", "bangkok", "chiang mai"]
          }

          def clean(v):
              if isinstance(v, list):
                  return ", ".join(map(str, v))
              return html.unescape(str(v or ""))

          def plain(v):
              return re.sub(r"\s+", " ",
                  re.sub(r"<[^>]*>", " ", clean(v))).strip().lower()

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Switchremote/1.0",
                  "Accept": "application/json"
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def parse_date(value):
              if not value:
                  return None
              try:
                  if isinstance(value, (int, float)):
                      if value > 10**12:
                          value /= 1000
                      return datetime.fromtimestamp(value, timezone.utc)
                  d = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=timezone.utc)
                  return d.astimezone(timezone.utc)
              except (ValueError, TypeError, OverflowError):
                  return None

          def is_recent(value):
              d = parse_date(value)
              return bool(d and NOW - timedelta(days=30) <= d
                          <= NOW + timedelta(days=1))

          def country_match(location):
              loc = clean(location).lower()
              for country, aliases in COUNTRIES.items():
                  if any(a in loc for a in aliases):
                      return country
              return None

          def valid_url(url, hosts):
              p = urlparse(clean(url))
              return bool(p.scheme == "https" and p.hostname and any(
                  p.hostname == h or p.hostname.endswith("." + h)
                  for h in hosts
              ))

          def eligible(job, remote_verified=False):
              title = clean(job.get("title")).lower()
              location = clean(job.get("location")).lower()
              desc = plain(job.get("description"))
              text = title + " " + desc

              if not title or not country_match(location):
                  return False, "country/location"

              if not remote_verified:
                  remote_words = [
                      "remote", "fully remote", "100% remote",
                      "work from home", "work-from-home"
                  ]
                  if not any(w in title + " " + location + " " + desc
                             for w in remote_words):
                      return False, "remote not confirmed"

              if re.search(
                  r"\b(on[- ]?site|hybrid|in[- ]office|office[- ]based)\b",
                  title + " " + location
              ):
                  return False, "onsite/hybrid"

              if re.search(
                  r"\b(senior|principal|director|manager|head of|"
                  r"vice president|team lead|lead engineer|staff engineer)\b",
                  title
              ):
                  return False, "experienced title"

              experience_patterns = [
                  r"\b[2-9]\+?\s+years?\s+(?:of\s+)?experience\b",
                  r"\bminimum\s+(?:of\s+)?[2-9]\s+years?",
                  r"\bat least\s+[2-9]\s+years?"
              ]
              if any(re.search(p, text) for p in experience_patterns):
                  return False, "experience requirement"

              if not (ENTRY_TITLE.search(title)
                      or ENTRY_DESC.search(desc)):
                  return False, "not clearly entry-level"

              if not is_recent(job.get("postedAt")):
                  return False, "missing/old posting date"

              return True, "accepted"

          jobs = []
          errors = []

          def process(job, verified=False):
              ok, reason = eligible(job, verified)
              if ok:
                  jobs.append(job)
              return ok, reason

          with open("employers.json", encoding="utf-8") as f:
              employers = json.load(f).get("employers", [])

          for employer in employers:
              if employer.get("approved") is not True:
                  continue

              name = clean(employer.get("company"))
              kind = clean(employer.get("source_type")).lower()
              token = clean(employer.get("board_token"))

              if not name or not token:
                  errors.append(f"{name or 'Employer'}: missing token")
                  continue

              if kind not in ("greenhouse", "lever", "ashby",
                              "smartrecruiters"):
                  errors.append(f"{name}: unsupported source {kind}")
                  continue

              try:
                  if kind == "greenhouse":
                      data = fetch(
                          "https://boards-api.greenhouse.io/v1/boards/"
                          + token + "/jobs?content=true"
                      )
                      items = data.get("jobs", [])
                  elif kind == "lever":
                      data = fetch(
                          "https://api.lever.co/v0/postings/"
                          + token + "?mode=json"
                      )
                      items = data if isinstance(data, list) else []
                  elif kind == "ashby":
                      data = fetch(
                          "https://api.ashbyhq.com/posting-api/job-board/"
                          + token
                      )
                      items = data.get("jobs", [])
                  else:
                      data = fetch(
                          "https://api.smartrecruiters.com/v1/companies/"
                          + token + "/postings?limit=100"
                      )
                      items = data.get("content", [])

                  added = 0
                  rejected = {}

                  for item in items:
                      verified_remote = False
                      salary = ""

                      if kind == "greenhouse":
                          title = clean(item.get("title"))
                          loc = clean((item.get("location") or {}).get("name"))
                          desc = clean(item.get("content"))
                          url = clean(item.get("absolute_url"))
                          posted = clean(item.get("first_published"))
                          jobid = clean(item.get("id"))
                          hosts = [
                              "boards.greenhouse.io",
                              "job-boards.greenhouse.io"
                          ]

                      elif kind == "lever":
                          cat = item.get("categories") or {}
                          title = clean(item.get("text"))
                          loc = clean(cat.get("location"))
                          desc = clean(item.get("descriptionPlain")
                                       or item.get("description"))
                          url = clean(item.get("hostedUrl"))
                          posted = clean(item.get("createdAt"))
                          jobid = clean(item.get("id"))
                          verified_remote = (
                              clean(item.get("workplaceType")).lower()
                              == "remote"
                          )
                          hosts = ["jobs.lever.co"]

                      elif kind == "ashby":
                          title = clean(item.get("title"))
                          loc = clean(item.get("location"))
                          desc = clean(item.get("descriptionPlain")
                                       or item.get("descriptionHtml"))
                          url = clean(item.get("jobUrl"))
                          posted = clean(item.get("publishedAt"))
                          jobid = url
                          verified_remote = (
                              item.get("isRemote") is True
                              or clean(item.get("workplaceType")).lower()
                              == "remote"
                          )
                          hosts = ["jobs.ashbyhq.com"]
                          if item.get("isListed") is not True:
                              continue
                          comp = item.get("compensation") or {}
                          salary = clean(
                              comp.get("scrapeableCompensationSalarySummary")
                          )

                      else:
                          title = clean(item.get("name"))
                          loc_data = item.get("location")
                          loc = clean(
                              loc_data.get("fullLocation")
                              if isinstance(loc_data, dict) else loc_data
                          )
                          desc = clean(item.get("jobAd", {}).get(
                              "sections", {}).get("jobDescription", {}).get(
                              "text", ""))
                          url = clean(item.get("ref"))
                          posted = clean(item.get("releasedDate"))
                          jobid = clean(item.get("id"))
                          hosts = ["jobs.smartrecruiters.com"]

                      if not jobid or not valid_url(url, hosts):
                          continue

                      job = {
                          "id": name + "-" + clean(jobid),
                          "title": title,
                          "company": name,
                          "url": url,
                          "location": loc,
                          "category": "",
                          "type": "Remote",
                          "salary": salary,
                          "logo": "",
                          "source": kind.title(),
                          "description": desc,
                          "postedAt": posted
                      }

                      ok, reason = process(job, verified_remote)
                      if ok:
                          added += 1
                      else:
                          rejected[reason] = rejected.get(reason, 0) + 1

                  print(f"{name} ({kind}): checked {len(items)}, "
                        f"eligible {added}, rejected {rejected}")

              except Exception as exc:
                  errors.append(f"{name} ({kind}): {exc}")

          # Jobicy public API; keep original source and application URL.
          try:
              data = fetch("https://jobicy.com/api/jobs?count=200")
              items = data.get("jobs", [])
              added = 0
              rejected = {}

              for item in items:
                  title = clean(item.get("jobTitle"))
                  loc = clean(item.get("jobGeo"))
                  desc = clean(item.get("jobDescription"))
                  url = clean(item.get("url"))
                  posted = clean(item.get("pubDate"))
                  jobid = clean(item.get("id"))
                  level = clean(item.get("jobLevel")).lower()
                  types = clean(item.get("jobType")).lower()

                  if not valid_url(url, ["jobicy.com"]):
                      continue

                  entry_signal = (
                      ENTRY_TITLE.search(title.lower())
                      or ENTRY_DESC.search(plain(desc))
                      or "intern" in types
                      or "entry" in level
                      or "junior" in level
                      or "graduate" in level
                  )

                  if level in ("senior", "mid", "mid-level", "manager"):
                      ok, reason = False, "experienced level"
                  elif not entry_signal:
                      ok, reason = False, "not clearly entry-level"
                  else:
                      job = {
                          "id": "Jobicy-" + jobid,
                          "title": title,
                          "company": clean(item.get("companyName")),
                          "url": url,
                          "location": loc,
                          "category": clean(item.get("jobIndustry")),
                          "type": "Remote",
                          "salary": "",
                          "logo": clean(item.get("companyLogo")),
                          "source": "Jobicy",
                          "description": desc,
                          "postedAt": posted
                      }
                      ok, reason = process(job, True)

                  if ok:
                      added += 1
                  else:
                      rejected[reason] = rejected.get(reason, 0) + 1

              print(f"Jobicy: checked {len(items)}, eligible {added}, "
                    f"rejected {rejected}")

          except Exception as exc:
              errors.append(f"Jobicy: {exc}")

          for error in errors:
              print("SOURCE ERROR:", error)

          unique = {}
          for job in jobs:
              key = job["url"].split("?")[0].rstrip("/").lower()
              unique.setdefault(key, job)

          output = {
              "updatedAt": NOW.isoformat(),
              "jobs": list(unique.values())
          }

          with open("jobs.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Saved {len(output['jobs'])} qualifying jobs")
          PY

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update trusted remote jobs"
            git push
          else
            echo "No changes to commit"
          fi
