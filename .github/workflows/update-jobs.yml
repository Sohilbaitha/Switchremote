
name: Update trusted remote jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-remote-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and filter jobs
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlparse, urlencode

          NOW = datetime.now(timezone.utc)

          COUNTRIES = {
              "India": ["india", "bengaluru", "bangalore", "mumbai",
                        "delhi", "hyderabad", "chennai", "pune", "noida"],
              "Indonesia": ["indonesia", "jakarta", "surabaya", "bandung",
                            "yogyakarta", "bali"],
              "Philippines": ["philippines", "manila", "cebu"],
              "Vietnam": ["vietnam", "viet nam", "ho chi minh", "hanoi"],
              "Malaysia": ["malaysia", "kuala lumpur", "penang"],
              "Thailand": ["thailand", "bangkok", "chiang mai"]
          }

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Switchremote/1.0",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def clean(value):
              if isinstance(value, list):
                  return ", ".join(map(str, value))
              return html.unescape(str(value or ""))

          def plain(value):
              value = re.sub(r"<[^>]*>", " ", clean(value))
              return re.sub(r"\s+", " ", value).strip().lower()

          def parse_date(value):
              if not value:
                  return None
              try:
                  if isinstance(value, (int, float)):
                      if value > 10**12:
                          value /= 1000
                      return datetime.fromtimestamp(value, timezone.utc)
                  value = str(value).replace("Z", "+00:00")
                  result = datetime.fromisoformat(value)
                  if result.tzinfo is None:
                      result = result.replace(tzinfo=timezone.utc)
                  return result.astimezone(timezone.utc)
              except (ValueError, TypeError, OverflowError):
                  return None

          def recent(value):
              date = parse_date(value)
              return bool(
                  date
                  and NOW - timedelta(days=30) <= date
                  <= NOW + timedelta(days=1)
              )

          def country_match(location):
              loc = clean(location).lower()
              for country, aliases in COUNTRIES.items():
                  if any(alias in loc for alias in aliases):
                      return country
              return None

          def eligible(job, remote_verified=False):
              title = clean(job.get("title")).lower()
              location = clean(job.get("location")).lower()
              description = plain(job.get("description"))
              text = title + " " + description

              if not title or not country_match(location):
                  return False, "country/location"

              remote_terms = [
                  "remote", "fully remote", "100% remote",
                  "work from home", "work-from-home"
              ]
              if not remote_verified and not any(
                  term in title + " " + location + " " + description
                  for term in remote_terms
              ):
                  return False, "remote not verified"

              # Reject only work-mode indicators, not casual mentions.
              if re.search(
                  r"\b(on[- ]?site|hybrid|in[- ]office|office[- ]based)\b",
                  title + " " + location
              ):
                  return False, "onsite/hybrid"

              if re.search(
                  r"\b(senior|principal|director|manager|head of|"
                  r"vice president|team lead|lead engineer|staff engineer)\b",
                  title
              ):
                  return False, "experienced title"

              experience_patterns = [
                  r"\b[2-9]\+?\s+years?\s+(?:of\s+)?experience\b",
                  r"\bminimum\s+(?:of\s+)?[2-9]\s+years?",
                  r"\bat least\s+[2-9]\s+years?"
              ]
              if any(re.search(pattern, text) for pattern in experience_patterns):
                  return False, "experience requirement"

              entry_terms = [
                  "intern", "internship", "entry-level", "entry level",
                  "graduate", "fresh graduate", "new grad", "trainee",
                  "junior", "no experience required", "no prior experience",
                  "0-1 years", "0–1 years", "0 years of experience"
              ]
              if not any(term in title or term in description
                         for term in entry_terms):
                  return False, "not explicitly entry-level"

              if not recent(job.get("postedAt")):
                  return False, "date missing or older than 30 days"

              return True, "accepted"

          def safe_url(url, hosts):
              parsed = urlparse(clean(url))
              return bool(
                  parsed.scheme == "https"
                  and parsed.hostname
                  and any(
                      parsed.hostname == host
                      or parsed.hostname.endswith("." + host)
                      for host in hosts
                  )
              )

          jobs = []
          errors = []

          def add_job(job, remote_verified=False):
              ok, reason = eligible(job, remote_verified)
              if ok:
                  jobs.append(job)
              return ok, reason

          # 1. Approved official employer boards.
          with open("employers.json", encoding="utf-8") as f:
              config = json.load(f)

          for employer in config.get("employers", []):
              if employer.get("approved") is not True:
                  continue

              name = clean(employer.get("company"))
              kind = clean(employer.get("source_type")).lower()
              token = clean(employer.get("board_token"))

              if not name or not token:
                  errors.append(f"{name or 'Employer'}: missing board token")
                  continue

              if kind not in ("greenhouse", "lever", "ashby"):
                  errors.append(f"{name}: unsupported source {kind}")
                  continue

              try:
                  if kind == "greenhouse":
                      data = fetch(
                          "https://boards-api.greenhouse.io/v1/boards/"
                          + token + "/jobs?content=true"
                      )
                      items = data.get("jobs", [])
                  elif kind == "lever":
                      data = fetch(
                          "https://api.lever.co/v0/postings/"
                          + token + "?mode=json"
                      )
                      items = data if isinstance(data, list) else []
                  else:
                      data = fetch(
                          "https://api.ashbyhq.com/posting-api/job-board/"
                          + token
                      )
                      items = data.get("jobs", [])

                  added = 0
                  rejected = {}

                  for item in items:
                      if kind == "greenhouse":
                          title = clean(item.get("title"))
                          location = clean((item.get("location") or {}).get("name"))
                          description = clean(item.get("content"))
                          url = clean(item.get("absolute_url"))
                          # Greenhouse updated_at is not guaranteed to be original posting date.
                          posted = clean(item.get("first_published"))
                          if not posted:
                              posted = clean(item.get("created_at"))
                          job_id = clean(item.get("id"))
                          hosts = ["boards.greenhouse.io"]
                          remote_verified = False

                      elif kind == "lever":
                          categories = item.get("categories") or {}
                          title = clean(item.get("text"))
                          location = clean(categories.get("location"))
                          description = clean(
                              item.get("descriptionPlain") or item.get("description")
                          )
                          url = clean(item.get("hostedUrl"))
                          posted = clean(item.get("createdAt"))
                          job_id = clean(item.get("id"))
                          hosts = ["jobs.lever.co"]
                          remote_verified = (
                              clean(item.get("workplaceType")).lower() == "remote"
                          )

                      else:
                          title = clean(item.get("title"))
                          location = clean(item.get("location"))
                          description = clean(
                              item.get("descriptionPlain")
                              or item.get("descriptionHtml")
                          )
                          url = clean(item.get("jobUrl"))
                          posted = clean(item.get("publishedAt"))
                          job_id = url
                          hosts = ["jobs.ashbyhq.com"]
                          remote_verified = (
                              clean(item.get("workplaceType")).lower() == "remote"
                          )
                          if item.get("isListed") is not True:
                              continue

                      if not title or not job_id or not safe_url(url, hosts):
                          continue

                      job = {
                          "id": name + "-" + job_id,
                          "title": title,
                          "company": name,
                          "url": url,
                          "location": location,
                          "category": "",
                          "type": "Remote",
                          "salary": "",
                          "logo": "",
                          "source": kind.title(),
                          "description": description,
                          "postedAt": posted
                      }

                      ok, reason = add_job(job, remote_verified)
                      if ok:
                          added += 1
                      else:
                          rejected[reason] = rejected.get(reason, 0) + 1

                  print(
                      f"{name} ({kind}): checked {len(items)}, "
                      f"eligible {added}, rejected {rejected}"
                  )

              except Exception as exc:
                  errors.append(f"{name} ({kind}): {exc}")

          # 2. Jobicy public API. Preserve original Jobicy application URL.
          try:
              data = fetch(
                  "https://jobicy.com/api/jobs?"
                  + urlencode({"count": 200})
              )
              if data.get("success") is False:
                  raise RuntimeError(data.get("error", "API error"))

              items = data.get("jobs", [])
              added = 0
              rejected = {}

              for item in items:
                  title = clean(item.get("jobTitle"))
                  location = clean(item.get("jobGeo"))
                  description = clean(item.get("jobDescription"))
                  url = clean(item.get("url"))
                  posted = clean(item.get("pubDate"))
                  job_id = clean(item.get("id"))
                  level = clean(item.get("jobLevel")).lower()
                  job_types = clean(item.get("jobType")).lower()

                  if not safe_url(url, ["jobicy.com"]):
                      continue

                  job = {
                      "id": "Jobicy-" + job_id,
                      "title": title,
                      "company": clean(item.get("companyName")),
                      "url": url,
                      "location": location,
                      "category": clean(item.get("jobIndustry")),
                      "type": "Remote",
                      "salary": "",
                      "logo": clean(item.get("companyLogo")),
                      "source": "Jobicy",
                      "description": description,
                      "postedAt": posted
                  }

                  entry_signal = (
                      any(term in title + " " + plain(description)
                          for term in [
                              "intern", "internship", "entry-level",
                              "entry level", "graduate", "new grad",
                              "trainee", "junior", "no experience required",
                              "no prior experience", "0-1 years"
                          ])
                      or "intern" in job_types
                      or "entry" in level
                      or "junior" in level
                      or "graduate" in level
                  )

                  if level in ("senior", "mid", "mid-level", "manager"):
                      ok, reason = False, "experienced level"
                  elif not entry_signal:
                      ok, reason = False, "not explicitly entry-level"
                  else:
                      ok, reason = add_job(job, remote_verified=True)

                  if ok:
                      added += 1
                  else:
                      rejected[reason] = rejected.get(reason, 0) + 1

              print(
                  f"Jobicy: checked {len(items)}, eligible {added}, "
                  f"rejected {rejected}"
              )

          except Exception as exc:
              errors.append(f"Jobicy: {exc}")

          # Keep existing data if a source fails, but still report the error.
          if errors:
              print("SOURCE ERRORS:")
              for error in errors:
                  print(" - " + error)
              raise SystemExit("One or more feeds failed; inspect logs above.")

          unique = {}
          for job in jobs:
              key = job["url"].split("?")[0].rstrip("/").lower()
              unique.setdefault(key, job)

          output = {
              "updatedAt": NOW.isoformat(),
              "jobs": list(unique.values())
          }

          with open("jobs.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Saved {len(output['jobs'])} qualifying jobs")
          PY

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update trusted remote jobs"
            git push
          else
            echo "No changes to commit"
          fi
