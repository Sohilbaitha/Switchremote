name: Update trusted remote jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-remote-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and filter jobs
        run: |
          python - <<'PY'
          import json, re, html, sys, time
          import urllib.request, urllib.error
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlparse

          NOW = datetime.now(timezone.utc)
          MAX_AGE_DAYS = 45

          COUNTRIES = {
              "India": ["india", "bengaluru", "bangalore", "mumbai",
                        "delhi", "hyderabad", "chennai", "pune", "noida",
                        "gurgaon", "gurugram"],
              "Indonesia": ["indonesia", "jakarta", "surabaya", "bandung",
                            "yogyakarta", "bali"],
              "Philippines": ["philippines", "manila", "cebu", "davao"],
              "Vietnam": ["vietnam", "viet nam", "ho chi minh", "hanoi"],
              "Malaysia": ["malaysia", "kuala lumpur", "penang"],
              "Thailand": ["thailand", "bangkok", "chiang mai"]
          }
          COUNTRY_RX = {
              c: re.compile(r"\b(" + "|".join(re.escape(a) for a in al) + r")\b")
              for c, al in COUNTRIES.items()
          }
          ALL6 = list(COUNTRIES)

          WORLD = re.compile(
              r"\b(worldwide|world wide|anywhere|global|globally|"
              r"all countries|work from anywhere)\b")
          REGION = re.compile(
              r"\b(apac|asia|asia pacific|asia-pacific|"
              r"southeast asia|south east asia)\b")
          RESTRICT = re.compile(
              r"\b(us|usa|u\.s\.|united states|canada|uk|united kingdom|"
              r"europe|emea|eu|latam|latin america|americas|"
              r"north america|australia|new zealand)\b")
          REMOTE_LOC = re.compile(
              r"\b(remote|work from home|wfh|anywhere|worldwide|distributed)\b")
          REMOTE_DESC = re.compile(
              r"(fully remote|100% remote|remote[- ](first|position|role|work|job)"
              r"|work from home|work-from-home)")
          HYBRID = re.compile(
              r"\b(on[- ]?site|hybrid|in[- ]office|office[- ]based)\b")
          SENIOR = re.compile(
              r"\b(senior|sr|principal|director|manager|head of|"
              r"vice president|vp|team lead|tech lead|lead engineer|"
              r"lead developer|staff engineer|architect|chief|expert)\b")
          EXP = [
              re.compile(r"\b(?:[2-9]|1\d)\s*\+?\s*(?:(?:-|–|to)\s*\d+\s*)?"
                         r"years?\b[^.]{0,40}\bexperience"),
              re.compile(r"\bexperience\b[^.]{0,30}\b(?:[2-9]|1\d)\s*\+?\s*"
                         r"years?\b"),
              re.compile(r"\b(?:minimum|min\.?|at least)\s+(?:of\s+)?"
                         r"(?:[2-9]|1\d)\s*\+?\s*years?")
          ]
          ENTRY_TITLE = re.compile(
              r"\b(intern|internship|entry[- ]level|graduate|"
              r"fresh graduate|new grad|trainee|junior)\b")
          ENTRY_DESC = re.compile(
              r"\b(intern|internship|entry[- ]level|fresh graduate|"
              r"new grad|recent graduate|trainee|junior|"
              r"no experience required|no prior experience|"
              r"0[-–]1 years?|0 years of experience)\b")
          FRIENDLY = re.compile(
              r"\b(customer support|customer service|customer care|"
              r"customer success|support agent|support representative|"
              r"support associate|helpdesk|help desk|technical support|"
              r"it support|associate|assistant|coordinator|representative|"
              r"data entry|annotator|annotation|content moderator|"
              r"moderator|sales development|sdr|bdr|virtual assistant|"
              r"social media|content writer|copywriter)\b")

          def clean(v):
              if isinstance(v, list):
                  return ", ".join(map(str, v))
              return html.unescape(str(v or ""))

          def plain(v):
              return re.sub(r"\s+", " ",
                  re.sub(r"<[^>]*>", " ", clean(v))).strip().lower()

          def fetch(url, tries=3):
              last = None
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "Switchremote/1.0 "
                                        "(+https://sohilbaitha.github.io/Switchremote/)",
                          "Accept": "application/json"
                      })
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code in (400, 401, 403, 404):
                          break
                      time.sleep(3 * (i + 1))
                  except Exception as e:
                      last = e
                      time.sleep(3 * (i + 1))
              raise last

          def parse_date(value):
              if value is None or value == "":
                  return None
              try:
                  if isinstance(value, (int, float)):
                      if value > 10**12:
                          value /= 1000
                      return datetime.fromtimestamp(value, timezone.utc)
                  s = str(value).strip()
                  if s.isdigit():
                      return parse_date(int(s))
                  d = datetime.fromisoformat(s.replace("Z", "+00:00"))
                  if d.tzinfo is None:
                      d = d.replace(tzinfo=timezone.utc)
                  return d.astimezone(timezone.utc)
              except (ValueError, TypeError, OverflowError, OSError):
                  return None

          def valid_url(url, hosts):
              p = urlparse(clean(url))
              return bool(p.scheme == "https" and p.hostname and any(
                  p.hostname == h or p.hostname.endswith("." + h)
                  for h in hosts
              ))

          def resolve_countries(location):
              loc = clean(location).lower()
              found = [c for c, rx in COUNTRY_RX.items() if rx.search(loc)]
              if found:
                  return found, "country"
              if RESTRICT.search(loc):
                  return [], ""
              if WORLD.search(loc):
                  return ALL6[:], "worldwide"
              if REGION.search(loc):
                  return ALL6[:], "region"
              return [], ""

          def consider(r):
              title = clean(r.get("title")).strip()
              tl = title.lower()
              loc = clean(r.get("location"))
              desc = plain(r.get("desc"))

              if not title or not r.get("url") or not r.get("id"):
                  return False, "missing data", None

              countries, scope = resolve_countries(loc)
              allowed = r.get("eligible_countries")
              if allowed:
                  countries = [c for c in countries if c in allowed]
              if not countries:
                  return False, "country/location", None

              if not r.get("remote_verified"):
                  if not (REMOTE_LOC.search(tl + " " + loc.lower())
                          or REMOTE_DESC.search(desc)):
                      return False, "remote not confirmed", None

              if HYBRID.search(tl + " " + loc.lower()):
                  return False, "onsite/hybrid", None

              if SENIOR.search(tl) or r.get("level") == "senior":
                  return False, "experienced title", None

              text = tl + " " + desc
              if any(rx.search(text) for rx in EXP):
                  return False, "experience requirement", None

              if r.get("entry_required", True):
                  if not (r.get("level") == "entry"
                          or ENTRY_TITLE.search(tl)
                          or ENTRY_DESC.search(desc)
                          or FRIENDLY.search(tl)):
                      return False, "not clearly entry-level", None

              d = parse_date(r.get("posted"))
              if not (d and NOW - timedelta(days=MAX_AGE_DAYS) <= d
                      <= NOW + timedelta(days=1)):
                  return False, "missing/old posting date", None

              job = {
                  "id": clean(r["id"]),
                  "title": title,
                  "company": clean(r.get("company")),
                  "url": clean(r["url"]),
                  "location": loc,
                  "category": clean(r.get("category")),
                  "type": "Remote",
                  "salary": clean(r.get("salary")),
                  "logo": clean(r.get("logo")),
                  "source": r["source"],
                  "description": desc[:1500],
                  "postedAt": d.isoformat(),
                  "countries": countries,
                  "scope": scope
              }
              return True, "accepted", job

          accepted = []
          stats = {}
          errors = []

          def run(key, label, raws):
              checked, got, rej = 0, 0, {}
              for r in raws:
                  checked += 1
                  ok, reason, job = consider(r)
                  if ok:
                      job["sourceKey"] = key
                      accepted.append(job)
                      got += 1
                  else:
                      rej[reason] = rej.get(reason, 0) + 1
              stats[key] = True
              print(f"{label}: checked {checked}, accepted {got}, "
                    f"rejected {rej}")

          def employer_items(emp):
              name = clean(emp.get("company"))
              kind = clean(emp.get("source_type")).lower()
              token = clean(emp.get("board_token"))
              allowed = emp.get("eligible_countries") or None
              entry_req = emp.get("entry_level_only") is not False
              out = []

              if kind == "greenhouse":
                  data = fetch("https://boards-api.greenhouse.io/v1/boards/"
                               + token + "/jobs?content=true")
                  hosts = ["boards.greenhouse.io", "job-boards.greenhouse.io"]
                  for it in data.get("jobs", []):
                      url = clean(it.get("absolute_url"))
                      if not valid_url(url, hosts):
                          continue
                      out.append(dict(
                          id=name + "-" + clean(it.get("id")),
                          title=it.get("title"), company=name, url=url,
                          location=(it.get("location") or {}).get("name"),
                          desc=it.get("content"),
                          posted=it.get("first_published"),
                          source="Greenhouse"))

              elif kind == "lever":
                  data = fetch("https://api.lever.co/v0/postings/"
                               + token + "?mode=json")
                  if not isinstance(data, list):
                      data = []
                  for it in data:
                      url = clean(it.get("hostedUrl"))
                      if not valid_url(url, ["jobs.lever.co"]):
                          continue
                      cat = it.get("categories") or {}
                      locs = [clean(cat.get("location"))]
                      for extra in cat.get("allLocations") or []:
                          if clean(extra) not in locs:
                              locs.append(clean(extra))
                      out.append(dict(
                          id=name + "-" + clean(it.get("id")),
                          title=it.get("text"), company=name, url=url,
                          location=", ".join(x for x in locs if x),
                          desc=it.get("descriptionPlain")
                               or it.get("description"),
                          posted=it.get("createdAt"),
                          remote_verified=clean(
                              it.get("workplaceType")).lower() == "remote",
                          source="Lever"))

              elif kind == "ashby":
                  data = fetch("https://api.ashbyhq.com/posting-api/job-board/"
                               + token)
                  for it in data.get("jobs", []):
                      if it.get("isListed") is not True:
                          continue
                      url = clean(it.get("jobUrl"))
                      if not valid_url(url, ["jobs.ashbyhq.com"]):
                          continue
                      secs = [clean(s.get("location"))
                              for s in (it.get("secondaryLocations") or [])
                              if isinstance(s, dict)]
                      locs = [clean(it.get("location"))] + secs
                      comp = it.get("compensation") or {}
                      out.append(dict(
                          id=name + "-" + url, title=it.get("title"),
                          company=name, url=url,
                          location=", ".join(x for x in locs if x),
                          desc=it.get("descriptionPlain")
                               or it.get("descriptionHtml"),
                          posted=it.get("publishedAt"),
                          salary=comp.get(
                              "scrapeableCompensationSalarySummary"),
                          remote_verified=(
                              it.get("isRemote") is True
                              or clean(it.get("workplaceType")).lower()
                              == "remote"),
                          source="Ashby"))

              elif kind == "smartrecruiters":
                  data = fetch("https://api.smartrecruiters.com/v1/companies/"
                               + token + "/postings?limit=100")
                  for it in data.get("content", []):
                      url = clean(it.get("ref"))
                      if not valid_url(url, ["jobs.smartrecruiters.com"]):
                          continue
                      ld = it.get("location")
                      out.append(dict(
                          id=name + "-" + clean(it.get("id")),
                          title=it.get("name"), company=name, url=url,
                          location=(ld.get("fullLocation")
                                    if isinstance(ld, dict) else ld),
                          desc=((it.get("jobAd") or {}).get("sections") or {})
                               .get("jobDescription", {}).get("text", ""),
                          posted=it.get("releasedDate"),
                          source="SmartRecruiters"))
              else:
                  raise ValueError("unsupported source " + kind)

              for o in out:
                  o["eligible_countries"] = allowed
                  o["entry_required"] = entry_req
              return out

          def jobicy_items():
              try:
                  data = fetch("https://jobicy.com/api/v2/remote-jobs?count=100")
              except Exception:
                  data = fetch("https://jobicy.com/api/jobs?count=200")
              out = []
              for it in data.get("jobs", []):
                  url = clean(it.get("url"))
                  if not valid_url(url, ["jobicy.com"]):
                      continue
                  level = clean(it.get("jobLevel")).lower()
                  types = clean(it.get("jobType")).lower()
                  lv = ""
                  if any(w in level for w in ("senior", "mid", "manager", "lead")):
                      lv = "senior"
                  elif (any(w in level for w in
                            ("junior", "entry", "intern", "graduate"))
                        or "intern" in types):
                      lv = "entry"
                  out.append(dict(
                      id="Jobicy-" + clean(it.get("id")),
                      title=it.get("jobTitle"),
                      company=it.get("companyName"), url=url,
                      location=it.get("jobGeo"),
                      desc=it.get("jobDescription"),
                      posted=it.get("pubDate"),
                      logo=it.get("companyLogo"),
                      category=it.get("jobIndustry"),
                      remote_verified=True, level=lv, source="Jobicy"))
              return out

          def remotive_items():
              data = fetch("https://remotive.com/api/remote-jobs")
              out = []
              for it in data.get("jobs", []):
                  url = clean(it.get("url"))
                  if not valid_url(url, ["remotive.com"]):
                      continue
                  out.append(dict(
                      id="Remotive-" + clean(it.get("id")),
                      title=it.get("title"),
                      company=it.get("company_name"), url=url,
                      location=it.get("candidate_required_location"),
                      desc=it.get("description"),
                      posted=it.get("publication_date"),
                      logo=it.get("company_logo"),
                      category=it.get("category"),
                      salary=it.get("salary"),
                      remote_verified=True, source="Remotive"))
              return out

          def remoteok_items():
              data = fetch("https://remoteok.com/api")
              out = []
              for it in data:
                  if (not isinstance(it, dict) or not it.get("id")
                          or not it.get("position")):
                      continue
                  url = clean(it.get("url"))
                  if not valid_url(url, ["remoteok.com"]):
                      continue
                  out.append(dict(
                      id="RemoteOK-" + clean(it.get("id")),
                      title=it.get("position"),
                      company=it.get("company"), url=url,
                      location=it.get("location"),
                      desc=it.get("description"),
                      posted=it.get("date") or it.get("epoch"),
                      logo=it.get("logo"),
                      category=", ".join((it.get("tags") or [])[:3]),
                      remote_verified=True, source="RemoteOK"))
              return out

          try:
              with open("jobs.json", encoding="utf-8") as f:
                  old_jobs = json.load(f).get("jobs", [])
                    except Exception:
              old_jobs = []

          BLOCKED = {"pratham international"}
          old_jobs = [j for j in old_jobs
                      if clean(j.get("company")).lower() not in BLOCKED]

          with open("employers.json", encoding="utf-8") as f:
              employers = json.load(f).get("employers", [])

          for emp in employers:
              if emp.get("approved") is not True:
                  continue
              name = clean(emp.get("company"))
              kind = clean(emp.get("source_type")).lower()
              if not name or not clean(emp.get("board_token")):
                  errors.append(f"{name or 'Employer'}: missing token")
                  continue
              try:
                  run(name, f"{name} ({kind})", employer_items(emp))
              except Exception as exc:
                  stats[name] = False
                  errors.append(f"{name} ({kind}): {exc}")

          for key, fn in (("Jobicy", jobicy_items),
                          ("Remotive", remotive_items),
                          ("RemoteOK", remoteok_items)):
              try:
                  run(key, key, fn())
              except Exception as exc:
                  stats[key] = False
                  errors.append(f"{key}: {exc}")

          for e in errors:
              print("SOURCE ERROR:", e)

          if stats and not any(stats.values()):
              print("ALL SOURCES FAILED - keeping old jobs.json")
              sys.exit(1)

          kept = 0
          for key in [k for k, ok in stats.items() if not ok]:
              for j in old_jobs:
                  if (j.get("sourceKey") == key or j.get("company") == key
                          or j.get("source") == key):
                      accepted.append(j)
                      kept += 1
          if kept:
              print(f"Kept {kept} old jobs from failed sources")

          if not accepted and old_jobs:
              print("WARNING: 0 jobs found, keeping old jobs")
              accepted = old_jobs

          seen_url, seen_sig, final = set(), set(), []
          for j in accepted:
              u = j["url"].split("?")[0].rstrip("/").lower()
              sig = (j["title"].lower().strip(),
                     j["company"].lower().strip(),
                     ",".join(sorted(j.get("countries", []))))
              if u in seen_url or sig in seen_sig:
                  continue
              seen_url.add(u)
              seen_sig.add(sig)
              final.append(j)

          final.sort(key=lambda j: (parse_date(j.get("postedAt"))
                                    or datetime(1970, 1, 1, tzinfo=timezone.utc)),
                     reverse=True)

          cover = {c: sum(1 for j in final if c in j.get("countries", []))
                   for c in ALL6}
          print("Country coverage:", cover)

          with open("jobs.json", "w", encoding="utf-8") as f:
              json.dump({"updatedAt": NOW.isoformat(), "jobs": final},
                        f, ensure_ascii=False, indent=2)

          print(f"Saved {len(final)} qualifying jobs")
          PY

      - name: Commit updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update trusted remote jobs"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi
