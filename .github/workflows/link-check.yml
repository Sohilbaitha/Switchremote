name: Company logos (one-off)
on:
  push:
    branches: [company-links-check]
permissions:
  contents: write
jobs:
  logos:
    if: "!contains(github.event.head_commit.message, '[logos]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scan/get_logos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos
          git commit -m "Company logos [logos]" && git push
