name: Company logos (one-off)
on:
  push:
    branches: [company-links-check]
permissions:
  contents: read
jobs:
  logos:
    if: "!contains(github.event.head_commit.message, '[logos]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scan/check_official.py
