name: Company logos (one-off)
on:
  push:
    branches: [company-links-check]
permissions:
  contents: read
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scan/get_logos.py
      - uses: actions/upload-artifact@v4
        with:
          name: logos
          path: logos/
