<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Switchremote</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.nf{text-align:center;padding:72px 0 96px}
.nf .big{margin:0;font-size:6rem;line-height:1;font-weight:700;color:var(--blue);letter-spacing:-.02em}
.nf h1{margin:14px 0 8px;font-size:1.5rem;line-height:1.3;color:#000}
.nf p{margin:0 auto 26px;color:var(--muted);max-width:420px}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.nf .apply{margin-top:0}
.ghost{display:inline-block;padding:6px 18px;border:1px solid var(--line);border-radius:999px;color:#000;font-size:.8125rem;font-weight:600;text-decoration:none}
.ghost:hover{border-color:var(--blue)}
@media (min-width:700px){.nf .big{font-size:8rem}.nf{padding:110px 0 140px}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="/"><img class="logo" src="/Logo.png" alt="Switchremote" height="34"></a>
  </div>
</header>
<main class="nf">
  <div class="wrap">
    <div class="big">404</div>
    <h1>Page not found</h1>
    <p>This link may be old or have a typo. The jobs are still on the homepage.</p>
    <div class="btns">
      <a class="apply" href="/">See all remote jobs</a>
      <a class="ghost" href="/contact.html">Contact us</a>
    </div>
  </div>
</main>
</body>
</html>
