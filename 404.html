<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Switchremote</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.nf{padding:56px 0 72px}
.big{display:flex;align-items:center;gap:14px;margin:0 0 26px;font-size:7.5rem;line-height:1;font-weight:700;color:#000;letter-spacing:-.02em}
.tog{position:relative;display:inline-block;width:.52em;height:.78em;border-radius:999px;background:#000}
.tog::after{content:"";position:absolute;left:50%;top:.08em;width:.36em;height:.36em;margin-left:-.18em;border-radius:50%;background:#fff;animation:flip 2.4s ease-in-out .4s infinite}
@keyframes flip{0%,35%{top:.08em}50%,85%{top:.34em}100%{top:.08em}}
@media (prefers-reduced-motion:reduce){.tog::after{animation:none}}
.nf h1{margin:0 0 10px;font-size:1.75rem;line-height:1.3;color:#000}
.nf p{margin:0 0 8px;color:#3d4954;max-width:520px}
.nf ul{margin:4px 0 26px;padding-left:18px;color:#3d4954}
.nf li{margin:4px 0}
.btns{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.nf .apply{margin-top:0;padding:10px 22px;font-size:.9375rem}
.ghost{display:inline-block;padding:9px 20px;border:1.5px solid var(--blue);border-radius:999px;color:#000;font-size:.9375rem;font-weight:600;text-decoration:none}
.ghost:hover{background:var(--tint)}
@media (min-width:700px){.big{font-size:10rem}.nf{padding:80px 0 100px}}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="/"><img class="logo" src="/Logo.png" alt="Switchremote" height="34"></a>
  </div>
</header>
<main class="nf">
  <div class="wrap">
    <div class="big" aria-label="404"><span>4</span><span class="tog" aria-hidden="true"></span><span>4</span></div>
    <h1>Page not found</h1>
    <p>We could not find the page you were looking for. This usually happens when:</p>
    <ul>
      <li>the link is old and the page has moved,</li>
      <li>there is a small typo in the address, or</li>
      <li>the page was removed from Switchremote.</li>
    </ul>
    <div class="btns">
      <a class="apply" href="/">See all remote jobs</a>
      <a class="ghost" href="/legal.html#contact">Contact us</a>
    </div>
  </div>
</main>
</body>
</html>
