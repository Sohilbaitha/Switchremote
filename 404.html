<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Switchremote</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png" type="image/png" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.nf{padding-top:48px}
.nf .wrap{padding-top:40px;padding-bottom:60px}
.nf h1{margin:0 0 10px;font-size:1.75rem;line-height:1.3;color:#000}
.nf p{margin:0 0 22px;color:var(--muted);max-width:460px}
.nf .apply{margin-top:0}

<body>

<main class="nf">
  <div class="wrap">
    <span class="code">404</span>
    <h1>This page took a remote break</h1>
    <p>The link may be old or typed wrong. The jobs are still right where you left them.</p>
    <a class="apply" href="/">See remote jobs</a>
  </div>
