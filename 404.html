<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){var d=document.documentElement,k='sr-theme',t;try{t=localStorage.getItem(k)}catch(e){}if(t==='dark')d.setAttribute('data-theme','dark');
function meta(on){var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=on?'#101317':'#ffffff'}
document.addEventListener('DOMContentLoaded',function(){var on=d.getAttribute('data-theme')==='dark',b=document.getElementById('thm');meta(on);if(b)b.setAttribute('aria-pressed',on)});
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#thm');if(!b)return;var on=d.getAttribute('data-theme')!=='dark';
if(on)d.setAttribute('data-theme','dark');else d.removeAttribute('data-theme');b.setAttribute('aria-pressed',on);meta(on);
try{localStorage.setItem(k,on?'dark':'light')}catch(e){}if(window.gtag)gtag('event','theme_toggle',{theme:on?'dark':'light'})})})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">

.ghost:hover{border-color:var(--blue)}
@media (min-width:700px){.nf .big{font-size:8rem}.nf{padding:110px 0 140px}}
